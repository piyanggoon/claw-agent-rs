[package]
name = "claw-agent-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Claw — Personal AI Companion powered by agent-sdk"
license = "MIT"
repository = "https://github.com/piyanggoon/claw-agent-rs"
homepage = "https://github.com/piyanggoon/claw-agent-rs"
keywords = ["ai", "agent", "companion", "llm", "rust"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
# Core agent SDK
agent-sdk = { git = "https://github.com/bipa-app/agent-sdk", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Web server
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Scheduling
cron = "0.13"
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for web_fetch tool)
reqwest = { version = "0.12", features = ["json", "gzip"] }
html2text = "0.14"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
regex = "1"
glob = "0.3"
dashmap = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Async traits
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
